<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafaf9" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Trainingsbuch, Anwesenheit und Saisonplanung für TV Bretten Basketball" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TrainerHub" />
    <title>TrainerHub</title>
    <script>
      // Theme vor dem ersten Rendern setzen (kein Aufblitzen). Logik gespiegelt in src/lib/theme.js
      (function () {
        var pref = "system";
        try { pref = localStorage.getItem("trainerhub_theme") || "system"; } catch (e) {}
        var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        var t = dark ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
        document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#1a1918" : "#fafaf9");
      })();
    </script>
    <style>
      html, body { margin: 0; background: #fafaf9; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #1a1918; }
      #root { min-height: 100vh; min-height: 100dvh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
