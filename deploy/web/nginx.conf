# Innerer Webserver des TrainerHub-Stacks (kein TLS – das übernimmt der vorhandene Reverse Proxy).
# Liefert die PWA aus und reicht /api/ an PocketBase weiter. Eine einzige Upstream-Adresse für
# den äußeren Proxy, eine Origin für App und API (Service Worker, Cookies, kein CORS).

# Echte Client-IP aus dem vorgelagerten Proxy (private Netze gelten als vertrauenswürdig)
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; "" $scheme; }

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 10m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # Docker-DNS: PocketBase wird bei jeder Anfrage aufgelöst (Neustart des Containers ohne nginx-Reload)
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $pb http://pocketbase:8090;
    proxy_pass $pb;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_read_timeout 120s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
  }

  # PocketBase-Dashboard nie öffentlich (Zugriff nur per SSH-Tunnel, siehe Handoff-Doku)
  location /_/ { return 404; }

  # PWA: Service Worker, Manifest und index.html nie lange cachen (Update-Hinweis)
  location = /sw.js { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options "nosniff" always; }
  location ~ ^/workbox-.*\.js$ { add_header Cache-Control "no-cache" always; }
  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "no-cache" always;
  }
  location = /index.html { add_header Cache-Control "no-cache" always; add_header X-Frame-Options "DENY" always; }

  # Gehashte Build-Dateien dürfen dauerhaft gecacht werden
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }

  # SPA-Fallback (die App nutzt keine URL-Pfade, schadet aber nicht)
  location / { try_files $uri $uri/ /index.html; }
}
